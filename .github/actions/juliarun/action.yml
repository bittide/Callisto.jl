name: 'Run Julia script'
description: 'Run a Julia script'
author: 'Sanjay Lall'

inputs:
  project:
    description: 'Passed to the --project flag.'
    default: '@.'
  script:
    description: 'Path of script.'
    default: '@.'
  dotest:
    description: 'Whether or not to run the package tests.'
    default: 'true'


runs:
  using: 'composite'
  steps:
  - run: julia --color=yes -e 'include("scripts/build.jl"); using .Build; Build.build_and_test(dotest = ${{inputs.dotest}}") '
    shell: bash


