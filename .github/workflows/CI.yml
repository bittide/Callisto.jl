#
# This file is based on one generated by PkgTemplates.jl
#
name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Create directory
        run: |
          mkdir others

      - name: Remove old project.toml
        run: |
          /bin/rm Project.toml

      - name: Checkout 
        uses: actions/checkout@v4
        with:
          repository: bittide/JuliaTools.jl
          path: others/JuliaTools.jl
          
      - name: Checkout 
        uses: actions/checkout@v4
        with:
          repository: bittide/Piecewise.jl
          path: others/Piecewise.jl

      - name: Checkout 
        uses: actions/checkout@v4
        with:
          repository: bittide/Topology.jl
          path: others/Topology.jl

      - name: Checkout 
        uses: actions/checkout@v4
        with:
          repository: bittide/StateSystems.jl
          path: others/StateSystems.jl

      - uses: julia-actions/cache@v2
      - uses: ./.github/actions/juliarun
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1



