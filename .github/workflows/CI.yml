#
name: CI
on:
  - push
  - pull_request
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
        with:
          repository: bittide/JuliaTools.jl

      - name: Checkout 
        uses: actions/checkout@v4
        with:
          repository: bittide/Piecewise.jl


        
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          localregistry: https://github.com/username/PersonalRegistry.git
      - uses: julia-actions/cache@v2
      - uses: ./.github/actions/juliarun
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1




      # Checkout another repository
      - name: Checkout another repo
        uses: actions/checkout@v4
        with:
          repository: <owner>/<repo-name>  # Replace with the owner and repository name
          path: ./another-repo             # Optional: specify a path to clone into (defaults to repo name)
          token: ${{ secrets.PAT }}      # Optional: Use a Personal Access Token if the repo is private or requires elevated access
